# cargo-about: THIRD_PARTY_NOTICES.md for the shipped native library (scripts/gen-notices.sh).
# Keep `accepted` in step with deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The workspace crates are ours, not third-party.
private = { ignore = true }
