[package]
name = "osaurus-sync-ffi"
description = "UniFFI bindings for Osaurus sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "osaurus_sync_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
osaurus-sync-core.workspace = true
osaurus-sync-net.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true
# libc 0.2.187+ limits `in6_ifreq` and the routing constants to macOS, which breaks netdev and
# netwatch on iOS. Lift once those crates gate their use.
libc = "<0.2.187"

[lints]
workspace = true

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tempfile = "3"
