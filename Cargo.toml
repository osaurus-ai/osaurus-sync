[workspace]
resolver = "3"
members = [
    "crates/osaurus-sync-core",
    "crates/osaurus-sync-net",
    "crates/osaurus-sync-ffi",
    "crates/osaurus-sync-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.89"

[workspace.dependencies]
osaurus-sync-core = { path = "crates/osaurus-sync-core" }
osaurus-sync-net = { path = "crates/osaurus-sync-net" }

anyhow = "1"
bip39 = "3"
blake3 = "1.8"
chacha20poly1305 = "0.11"
criterion = "0.8"
ed25519-dalek = "3"
hex = "0.4"
hkdf = "0.13"
iroh = "1.4"
k256 = "0.14"
loro = "1.17"
postcard = { version = "1", features = ["alloc"] }
rand_chacha = "0.9"
rand_core = "0.9"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3 = { version = "0.11", default-features = false }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uniffi = "=0.31.0"
uuid = "1.29"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The static libraries in the Swift xcframework. Fat LTO leaves one object without the embedded
# bitcode thin LTO needs, which keeps the libraries a fifth of the size.
[profile.staticlib]
inherits = "release"
lto = "fat"

