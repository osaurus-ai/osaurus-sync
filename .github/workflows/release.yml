name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-pre.N) builds, signs and publishes a release. Running it by
# hand is a dry run: everything is built and uploaded as workflow artifacts, nothing is signed
# unless the certificate is configured, and nothing is published. A prerelease tag (one with a
# suffix) may publish unsigned DLLs and skips the NuGet push when NUGET_API_KEY is unset; a
# final release requires both.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run packages
        required: true
        default: 0.0.0-dryrun

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  UNIFFI_BINDGEN_CS_TAG: v0.11.1+v0.31.0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            TAG="$GITHUB_REF_NAME"; VERSION="${TAG#v}"; PUBLISH=true
          else
            VERSION="${{ inputs.version }}"; TAG="v$VERSION"; PUBLISH=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a semantic version"; exit 1
          fi
          { echo "version=$VERSION"; echo "tag=$TAG"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"

  supply-chain:
    name: Licenses, notices and SBOM
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install || rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-about,cargo-cyclonedx
      - run: cargo deny --locked check
      - name: Third-party notices
        run: scripts/gen-notices.sh
      - name: SBOM
        run: scripts/gen-sbom.sh dist/sbom
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom/*.cdx.json

  apple:
    name: XCFramework
    runs-on: macos-15
    needs: [version, supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - name: Toolchain
        run: rustup toolchain install || rustup show
      - name: Build XCFramework (release)
        run: scripts/build-xcframework.sh
      - name: Swift tests
        working-directory: bindings/swift
        run: swift test
      - name: Zip and checksum
        run: |
          mkdir -p dist/osx-arm64
          cp target/aarch64-apple-darwin/release/libosaurus_sync_ffi.dylib dist/osx-arm64/
          (cd bindings/swift && zip -qry ../../dist/OsaurusSyncFFI.xcframework.zip OsaurusSyncFFI.xcframework)
          (cd bindings/swift && swift package compute-checksum ../../dist/OsaurusSyncFFI.xcframework.zip) > dist/OsaurusSyncFFI.xcframework.zip.checksum
          echo "SwiftPM checksum: $(cat dist/OsaurusSyncFFI.xcframework.zip.checksum)" >> "$GITHUB_STEP_SUMMARY"
      - name: Swift package
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/OsaurusSyncFFI.xcframework.zip"
          scripts/make-swift-package.sh dist/swift-package "$URL" "$(cat dist/OsaurusSyncFFI.xcframework.zip.checksum)"
          (cd dist/swift-package && swift package dump-package > /dev/null)
          test -f dist/swift-package/THIRD_PARTY_NOTICES.md && test -f dist/swift-package/LICENSE
          (cd dist && zip -qry "OsaurusSync-swift-${{ needs.version.outputs.version }}.zip" swift-package)
      - name: Local Swift package
        run: |
          scripts/make-swift-package.sh --local dist/local/OsaurusSync
          (cd dist/local/OsaurusSync && swift build -c release)
          rm -rf dist/local/OsaurusSync/.build
          (cd dist/local && zip -qry "../OsaurusSync-swift-local-${{ needs.version.outputs.version }}.zip" OsaurusSync)
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: |
            dist/OsaurusSyncFFI.xcframework.zip
            dist/OsaurusSyncFFI.xcframework.zip.checksum
            dist/OsaurusSync-swift-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: swift-package
          path: dist/swift-package/
      - uses: actions/upload-artifact@v4
        with:
          name: osx-arm64
          path: dist/osx-arm64/libosaurus_sync_ffi.dylib

  windows:
    name: Windows ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bindings: true
          - rid: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bindings: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/${{ matrix.target }}/rustup-init.exe"
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Toolchain
        run: |
          rustup toolchain install || rustup show
          rustup target add ${{ matrix.target }}
      - name: Build native library
        run: cargo build -p osaurus-sync-ffi --lib --release --locked --target ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install uniffi-bindgen-cs
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG"
      - name: Generate C# bindings
        run: scripts/gen-csharp.sh
        env:
          TARGET: ${{ matrix.target }}
      - name: xUnit tests
        run: dotnet test bindings/csharp/OsaurusSync.Tests -c Release
      - name: Stage
        run: |
          mkdir -p dist/${{ matrix.rid }}
          cp target/${{ matrix.target }}/release/osaurus_sync_ffi.dll dist/${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/osaurus_sync_ffi.dll
      - uses: actions/upload-artifact@v4
        if: matrix.bindings
        with:
          name: csharp-bindings
          path: bindings/csharp/OsaurusSync/Generated/

  sign:
    name: Sign Windows libraries
    runs-on: windows-latest
    needs: [version, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: dist
      - name: Authenticode
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          PUBLISH: ${{ needs.version.outputs.publish }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $dlls = Get-ChildItem dist -Recurse -Filter osaurus_sync_ffi.dll
          if (-not $env:CERT) {
            $prerelease = $env:VERSION.Contains('-')
            if ($env:PUBLISH -eq 'true' -and -not $prerelease) { throw "WINDOWS_SIGNING_CERT is not set; a release must be signed" }
            Write-Warning "No signing certificate: the $env:VERSION DLLs are unsigned"
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            foreach ($dll in $dlls) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERT_PASSWORD $dll.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing $($dll.FullName) failed" }
              & $signtool.FullName verify /pa $dll.FullName
              if ($LASTEXITCODE -ne 0) { throw "verifying $($dll.FullName) failed" }
            }
            Remove-Item $pfx
          }
          foreach ($dll in $dlls) {
            $rid = $dll.Directory.Name -replace '^unsigned-', ''
            New-Item -ItemType Directory -Force "signed/$rid" | Out-Null
            Copy-Item $dll.FullName "signed/$rid/"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: signed/win-x64/osaurus_sync_ffi.dll
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64
          path: signed/win-arm64/osaurus_sync_ffi.dll

  nuget:
    name: NuGet package
    runs-on: ubuntu-latest
    needs: [version, sign, apple]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: notices
      - uses: actions/download-artifact@v4
        with:
          pattern: "{win-x64,win-arm64,osx-arm64}"
          path: dist/native
      - uses: actions/download-artifact@v4
        with:
          name: csharp-bindings
          path: bindings/csharp/OsaurusSync/Generated
      - name: Pack
        run: |
          scripts/pack-nuget.sh dist/native
          unzip -l dist/nuget/*.nupkg | grep -q THIRD_PARTY_NOTICES.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: dist/nuget/*.nupkg

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [version, supply-chain, apple, nuget]
    if: needs.version.outputs.publish == 'true'
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{xcframework,nuget,notices,sbom}"
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          FLAGS=(--verify-tag --generate-notes)
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          # The version's CHANGELOG.md section goes above the generated notes.
          awk -v v="$VERSION" '/^## / { p = ($2 == v) } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            FLAGS+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION"
          fi
          gh release create "$TAG" "${FLAGS[@]}" \
            --title "Osaurus Sync $VERSION" \
            dist/OsaurusSyncFFI.xcframework.zip \
            dist/OsaurusSyncFFI.xcframework.zip.checksum \
            dist/OsaurusSync-swift-*.zip \
            dist/*.nupkg \
            dist/THIRD_PARTY_NOTICES.md \
            dist/*.cdx.json
      - name: NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            if [[ "$VERSION" == *-* ]]; then
              echo "::warning::NUGET_API_KEY is not set; the $VERSION package is only attached to the GitHub release"
              exit 0
            fi
            echo "::error::NUGET_API_KEY is not set"; exit 1
          fi
          dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" \
            --source "${{ vars.NUGET_SOURCE || 'https://api.nuget.org/v3/index.json' }}" --skip-duplicate

  swift-distribution:
    name: Swift distribution repository
    runs-on: ubuntu-latest
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true' && vars.SWIFT_DIST_REPO != ''
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swift-package
          path: package
      - name: Push and tag
        env:
          TOKEN: ${{ secrets.SWIFT_DIST_TOKEN }}
          REPO: ${{ vars.SWIFT_DIST_REPO }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::SWIFT_DIST_TOKEN is not set"; exit 1; fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$REPO.git" dist-repo
          cd dist-repo
          git rm -rq --ignore-unmatch .
          cp -R ../package/. .
          git add -A
          git -c user.name="osaurus-release" -c user.email="release@osaurus.ai" commit -qm "Osaurus Sync $VERSION" --allow-empty
          # SwiftPM resolves versions from tags without a "v" prefix.
          git tag "$VERSION"
          git push -q origin HEAD "$VERSION"
